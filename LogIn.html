<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FCAI-SOFRA - Log In</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  </head>
  <body>

    <button id="themeToggle" class="auth-theme-toggle">
      <i class="fas fa-moon"></i>
    </button>

    <div class="auth-bg" style="background-image: url('https://www.simplyrecipes.com/thmb/FRlM2EEuix3dh1WxFD2R_Gp-V4c=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/Simply-Recipes-Most-Popular-Recipes-Feature-LEAD-04-b4cc7e7bcfbe486586053a8e0a927d2f.jpg');">

      <div class="auth-card">

        <div class="auth-logo">FCAI-SOFRA</div>
        <p class="auth-subtitle">Welcome back. Please log in to continue.</p>

        <hr />

        <h2>Log In</h2>

        <form action="homepage.html" method="get">

          <div class="auth-field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Your username" required />
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required />
          </div>

          <button type="submit" class="auth-btn">Log In</button>

        </form>

        <div class="auth-links">
          <p>Don't have an account? <a href="./SignUp.html">Create one here</a></p>
          <p><a href="./EntryPage.html">Back to Welcome Page</a></p>
        </div>

      </div>

    </div>

    <div id="toast"></div>
    <script src="base.js"></script>

  </body>
</html>
