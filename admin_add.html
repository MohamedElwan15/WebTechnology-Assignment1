<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Add Recipe</title>
</head>

<body>
    <header>
        <h1>Add Recipe</h1>
    </header>
    <main>
        <form action="/submit-recipe" method="POST">
            <!--Admin name and Recipe ID are hardcoded now since html has no trace of the real data of the user-->
            <div>
                <input type="hidden" value="Chef Emad" name="Admin name">
            </div>
            <div>
                <input type="hidden" value="Recipe23" name="RecipedID">
            </div>
            <div>
                <label for="Recipe_name">Recipe Name</label>
                <input required type="text" id="Recipe_name" placeholder="Ex- White sauce pasta" name="RecipeName">
            </div>
            <div>
                <label for="course">Course</label>
                <select name="Courses" id="course" required>
                    <option value="" disabled selected>Select a course...</option>
                    <option value="appetizers">Appetizers</option>
                    <option value="main_course">Main Course</option>
                    <option value="dessert">Dessert</option>
                </select>
            </div>
            <div>
                <label for="Descriptionn">Description</label>
                <br>
                <textarea required name="Description" id="Descriptionn" cols="40" rows="3"
                    placeholder="Recipe Description"></textarea>
            </div>
            <div>
                <label for="recipe_img">Recipe Image</label>
                <br>
                <input required type="file" id="recipe_img" name="recipe_img" accept="image/*">
            </div>
            <fieldset>
                <legend>Ingredients</legend>
                <div class="row">
                    <label for="Ingredient_1">Ingredient 1</label>
                    <input type="hidden" name="ingredient_1_id" value="ID">
                    <input required type="text" id="Ingredient_1" name="ingredient_1_name" placeholder="Name">
                    <input required type="text" name="ingredient_1_qty" placeholder="Quantity">
                </div>
                <div class="row">
                    <label for="Ingredient_2">Ingredient 2</label>
                    <input type="hidden" name="ingredient_2_id" value="ID">
                    <input type="text" id="Ingredient_2" name="ingredient_2_name" placeholder="Name">
                    <input type="text" name="ingredient_2_qty" placeholder="Quantity">
                </div>
                <div class="row">
                    <label for="Ingredient_10">Ingredient 10</label>
                    <input type="hidden" name="ingredient_3_id" value="ID">
                    <input type="text" id="Ingredient_10" name="ingredient_10_name" placeholder="Name">
                    <input type="text" name="ingredient_10_qty" placeholder="Quantity">
                </div>
            </fieldset>
            <fieldset>
                <legend>Instructions</legend>
                <div>
                    <label for="step_1">Step 1</label>
                    <input required type="text" id="step_1" name="Step_1" placeholder="Step Description">
                </div>
                <div>
                    <label for="step_2">Step 2</label>
                    <input type="text" id="step_2" name="Step_2" placeholder="Step Description">
                </div>
                <div>
                    <label for="step_10">Step 10</label>
                    <input type="text" id="step_10" name="Step_10" placeholder="Step Description">
                </div>
            </fieldset>

            <button type="submit">Submit Recipe</button>
        </form>
    </main>
    <footer>
    </footer>
</body>

</html>
