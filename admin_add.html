<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Add Recipe</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <nav>
  <strong>FCAI - SOFRA</strong>
  <a href="homepage.html">Home</a>
  <a href="recList.html">All Recipes</a>
  <a href="search.html">Search</a>
  <a href="favorites.html">My Favorites</a>
  <a href="admin_recipes.html">Admin Dashboard</a>
  <a href="EntryPage.html">Logout</a>
  <button id="themeToggle" class="theme-toggle" style="margin-left: auto;">
    <i class="fas fa-moon"></i>
  </button>
</nav>

    
    <header>
        <h1><i class="fas fa-plus-circle"></i> Add Recipe</h1>
    </header>
    <main>
        <form action="/submit-recipe" method="POST" id="addRecipeForm">
            <!--Admin name and Recipe ID are hardcoded now since html has no trace of the real data of the user-->
            <div>
                <input type="hidden" name="Admin name" id="adminName">
            </div>
            <div>
                <input type="hidden" name="RecipedID" id="recipeId">
            </div>
            <div>
                <label for="Recipe_name">Recipe Name</label>
                <input required type="text" id="Recipe_name" placeholder="Ex- White sauce pasta" name="RecipeName">
            </div>
            <div>
                <label for="course">Course</label>
                <select name="Courses" id="course" required>
                    <option value="" disabled selected>Select a course...</option>
                    <option value="appetizers">Appetizers</option>
                    <option value="main_course">Main Course</option>
                    <option value="dessert">Dessert</option>
                </select>
            </div>
            <div>
                <label for="chefSelect">Chef</label>
                <select id="chefSelect" name="chefSelect">
                    <option value="">Self-Made (No Chef)</option>
                    <option value="Chef El Sherbiny">Chef El Sherbiny</option>
                    <option value="Chef Hassan">Chef Hassan</option>
                    <option value="Chef Nadia El Sayed">Chef Nadia El Sayed</option>
                </select>
                <small id="chefHint" style="display:block;margin-top:5px;color:var(--clr-muted);"></small>
            </div>
            <div>
                <label for="Descriptionn">Description</label>
                <br>
                <textarea required name="Description" id="Descriptionn" cols="40" rows="3"
                          placeholder="Recipe Description"></textarea>
            </div>
            <div>
                <label for="recipe_img">Recipe Image</label>
                <br>
                <label for="recipe_img" class="file-upload-label">
                    Click to upload image
                    <input type="file" id="recipe_img" name="recipe_img" accept="image/*">
                </label>
                <img id="imagePreview" src="" alt="Preview" style="display:none; width:200px; margin-top:10px;">
            </div>
            <fieldset>
                <legend><i class="fas fa-list"></i> Ingredients</legend>
                <div id="ingredientsList">
                </div>
                <button type="button" id="addIngredientBtn"><i class="fas fa-plus"></i> Add Ingredient</button>
            </fieldset>
            
            <fieldset>
                <legend><i class="fas fa-clipboard-list"></i> Instructions</legend>
                <div id="stepsList"></div>
                <button type="button" id="addStepBtn"><i class="fas fa-plus"></i> Add Step</button>
            </fieldset>
            

            <button type="submit"><i class="fas fa-save"></i> Submit Recipe</button>
        </form>
    </main>
    <footer>
    </footer>
    <div id="toast"></div>
        <script src="base.js"></script>
        <script src="admin.js"></script>
</body>

</html>
