<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FCAI-SOFRA - Create Account</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  </head>
  <body>

    <button id="themeToggle" class="auth-theme-toggle">
      <i class="fas fa-moon"></i>
    </button>

    <div class="auth-bg" style="background-image: url('https://www.simplyrecipes.com/thmb/FRlM2EEuix3dh1WxFD2R_Gp-V4c=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/Simply-Recipes-Most-Popular-Recipes-Feature-LEAD-04-b4cc7e7bcfbe486586053a8e0a927d2f.jpg');">

      <div class="auth-card">

        <div class="auth-logo">FCAI-SOFRA</div>
        <p class="auth-subtitle">Create your account to start exploring recipes.</p>

        <hr />

        <h2>Create an Account</h2>

        <form action="./LogIn.html" method="get">

          <div class="auth-field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required />
          </div>

          <div class="auth-field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" required />
          </div>

          <div class="auth-field">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required />
          </div>

          <div class="auth-checkbox">
            <input type="checkbox" id="is_admin" name="is_admin" value="true" />
            <label for="is_admin">Register as Admin</label>
            <small>(admin only)</small>
          </div>

          <button type="submit" class="auth-btn">Create Account</button>

        </form>

        <div class="auth-links">
          <p>Already have an account? <a href="./LogIn.html">Log in here</a></p>
          <p><a href="./EntryPage.html">Back to Welcome Page</a></p>
        </div>

      </div>

    </div>

    <div id="toast"></div>
    <script src="base.js"></script>

  </body>
</html>
