</head>

        </button>

    <hr />
    <header>
        <h1><i class="fas fa-utensils"></i> My Recipes</h1>
    </header>
    <main>
        <button type="button" onclick="window.location.href='admin_add.html'" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add Recipe
        </button>
        <table border="1" id="recipesTable">
            <thead>
                <tr>
                    <th>Recipe ID</th>
                    <th>Recipe Name</th>
                    <th>Course</th>
                    <th>Image</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="recipesTableBody">
            </tbody>
        </table>
        <p id="emptyState" style="display:none;">No recipes yet. <a href="admin_add.html">Add your first one!</a></p>
    </main>
    <footer>
    </footer>
    <div id="toast"></div>
    <div id="deleteModal" style="display:none;">
        <div id="deleteModalBox">
            <p id="deleteModalMsg">Are you sure you want to delete this recipe?</p>
            <button type="button" id="confirmDeleteBtn">Yes, Delete</button>
            <button type="button" id="cancelDeleteBtn">Cancel</button>
        </div>
    </div>
    <script src="base.js"></script>
    <script src="admin.js"></script>
