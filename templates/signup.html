{% extends 'base.html' %}
{% load static %}

{% block title %}Sign Up{% endblock %}

{% block extra_css %}
<style>
    .auth-container { max-width: 400px; margin: 50px auto; padding: 30px; background: var(--clr-card-bg); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .auth-container h2 { text-align: center; margin-bottom: 25px; color: var(--clr-orange); }
    .auth-container form p { margin-bottom: 15px; }
    .auth-container form input { width: 100%; padding: 10px; border: 1px solid var(--clr-border); border-radius: 6px; background: var(--clr-bg); color: var(--clr-text); }
    .auth-container button { width: 100%; padding: 12px; background: var(--clr-orange); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .auth-links { text-align: center; margin-top: 20px; }
    .auth-links a { color: var(--clr-orange); text-decoration: none; }
    
    /* Shrink Django help text (constraints) */
    .helptext { display: block; font-size: 0.75rem; color: var(--clr-muted); line-height: 1.3; margin-top: 4px; }
    ul.errorlist { color: #e74c3c; font-size: 0.85rem; margin-bottom: 10px; padding-left: 20px; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Join FCAI - SOFRA</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div style="margin: 20px 0; display: flex; align-items: center; gap: 10px; background: rgba(255,107,26,0.05); padding: 12px; border-radius: 8px; border: 1px dashed var(--clr-orange);">
            <input type="checkbox" id="is_admin" name="is_admin" style="width: auto; cursor: pointer;">
            <label for="is_admin" style="cursor: pointer; font-size: 0.9rem; color: var(--clr-text);">
                <strong>Register as Admin/Chef</strong><br>
                <small style="color: var(--clr-muted);">Allows you to add and manage your own recipes.</small>
            </label>
        </div>

        <button type="submit">Sign Up</button>
    </form>
    <div class="auth-links">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
    </div>
</div>
{% endblock %}
