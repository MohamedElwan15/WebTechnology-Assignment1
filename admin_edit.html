    <hr />
    <header>
        <h1>Edit Recipe</h1>
    </header>
    <main>
        <form action="/edit-recipe" method="POST">
            <div>
                <label for="Recipe_name">Recipe Name</label>
                <input required type="text" id="Recipe_name" value="Makarona Bashamel" name="RecipeName">
            </div>
            <div>
                <label for="course">Course</label>
                <select name="Courses" id="course" required>
                    <option value="" disabled>Select a course...</option>
                    <option value="appetizers">Appetizers</option>
                    <option value="main_course" selected>Main Course</option>
                    <option value="dessert">Dessert</option>
                </select>
            </div>
            <div>
                <label for="Descriptionn">Description</label>
                <br>
                <textarea required name="Description" id="Descriptionn" cols="40"
                          rows="3">A classic Egyptian baked pasta dish layered with creamy bechamel sauce and seasoned ground beef, oven baked until golden on top.</textarea>
            </div>
            <div>
                <label>Current Image</label>
                <br>
                <img src="https://elwasfa.com/wp-content/uploads/2020/04/for-web-2020-05-04T154957.204.jpg"
                     alt="Makarona Bashamel" width="200">
                <br>
                <label for="recipe_img">Change Image</label>
                <br>
                <input type="file" id="recipe_img" name="recipe_img" accept="image/*">
            </div>
            <fieldset>
                <legend>Ingredients</legend>
                <div class="row">
                    <label for="Ingredient_1">Ingredient 1</label>
                    <input type="hidden" name="ingredient_1_id" value="ING001">
                    <input required type="text" id="Ingredient_1" name="ingredient_1_name" value="Penne Pasta">
                    <input required type="text" name="ingredient_1_qty" value="500g">
                </div>
                <div class="row">
                    <label for="Ingredient_2">Ingredient 2</label>
                    <input type="hidden" name="ingredient_2_id" value="ING002">
                    <input type="text" id="Ingredient_2" name="ingredient_2_name" value="Ground Beef">
                    <input type="text" name="ingredient_2_qty" value="400g">
                </div>
                <div class="row">
                    <label for="Ingredient_10">Ingredient 3</label>
                    <input type="hidden" name="ingredient_3_id" value="ING003">
                    <input type="text" id="Ingredient_10" name="ingredient_10_name" value="Bechamel Sauce">
                    <input type="text" name="ingredient_10_qty" value="2 cups">
                </div>
            </fieldset>
            <fieldset>
                <legend>Instructions</legend>
                <div>
                    <label for="step_1">Step 1</label>
                    <input required type="text" id="step_1" name="Step_1"
                           value="Boil the pasta in salted water until al dente, then drain.">
                </div>
                <div>
                    <label for="step_2">Step 2</label>
                    <input type="text" id="step_2" name="Step_2"
                           value="Brown the ground beef with onions and season with salt, pepper and cumin.">
                </div>
                <div>
                    <label for="step    _10">Step 3</label>
                    <input type="text" id="step_10" name="Step_10"
                           value="Layer pasta, meat and bechamel in a baking dish then bake at 180C for 30 minutes.">
                </div>
            </fieldset>
            <button type="submit">Save Changes</button>
        </form>
    </main>
    <footer>
    </footer>
    <div id="toast"></div>
    <script src="base.js"></script>
</body>

</html>
